[app]
title = "RoadWatch AI"
subtitle = "Intelligent Road Condition Analysis"
version = "1.0.0"
default_confidence = 0.35
max_upload_size_mb = 15

[model]
weights_path = "models/best.pt"
input_size = 640
default_epochs = 50
default_batch_size = 16
target_class = "pothole"
rdd_target_code = "D40"

[paths]
raw_data_dir = "data/raw"
processed_data_dir = "data/processed"
dataset_yaml = "data/dataset.yaml"
predictions_dir = "outputs/predictions"
metrics_file = "outputs/metrics/evaluation_metrics.json"
plots_dir = "outputs/plots"

[palette]
primary = "#244B3C"
accent = "#6A8F78"
light_sage = "#E9F0EA"
background = "#F6F8F5"
surface = "#FFFFFF"
primary_text = "#26332B"
secondary_text = "#69766E"
border = "#D9E2DA"
success = "#3D7A57"
warning = "#B77A27"
error = "#B6534C"
